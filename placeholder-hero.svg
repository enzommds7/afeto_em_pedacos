<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBC9C1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F6EDE0"/>
    </linearGradient>
    <linearGradient id="brownieFudge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C1A1B"/>
      <stop offset="60%" stop-color="#3B1F17"/>
      <stop offset="100%" stop-color="#24120E"/>
    </linearGradient>
    <linearGradient id="crinkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8664C"/>
      <stop offset="50%" stop-color="#803B26"/>
      <stop offset="100%" stop-color="#5C1A1B"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3B1F17" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fundo suave editorial -->
  <rect width="800" height="600" fill="url(#heroBg)"/>
  
  <!-- Linhas de grid decorativas sutis -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#3B1F17" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="42" y="42" width="716" height="516" fill="none" stroke="#3B1F17" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.1"/>

  <!-- Tábua / Base minimalista -->
  <ellipse cx="400" cy="480" rx="310" ry="65" fill="#3B1F17" fill-opacity="0.08"/>
  <rect x="180" y="420" width="440" height="34" rx="2" fill="#B8664C" fill-opacity="0.25"/>

  <!-- Brownie 1 (Atrás, inclinado) -->
  <g transform="translate(230, 190) rotate(-6)" filter="url(#subtleShadow)">
    <rect x="0" y="0" width="220" height="190" rx="3" fill="url(#brownieFudge)"/>
    <!-- Camada superior com crosta brilhante e craquelada -->
    <rect x="0" y="0" width="220" height="65" rx="3" fill="url(#crinkle)"/>
    <!-- Linhas craqueladas características -->
    <path d="M15 25 Q60 15 110 32 T195 20" stroke="#EBC9C1" stroke-width="1.6" stroke-opacity="0.65" fill="none"/>
    <path d="M40 45 Q90 35 150 48" stroke="#EBC9C1" stroke-width="1.4" stroke-opacity="0.5" fill="none"/>
    <!-- Pedaços de chocolate e nozes -->
    <polygon points="50,22 68,18 64,30 46,28" fill="#3B1F17"/>
    <polygon points="140,25 156,20 160,34 144,32" fill="#5C1A1B"/>
    <ellipse cx="105" cy="24" rx="9" ry="6" fill="#BFD0B0" fill-opacity="0.85"/>
  </g>

  <!-- Brownie 2 (Frente, em primeiro plano) -->
  <g transform="translate(340, 240) rotate(5)" filter="url(#subtleShadow)">
    <rect x="0" y="0" width="230" height="195" rx="3" fill="url(#brownieFudge)"/>
    <!-- Textura úmida interna (fudgy) -->
    <rect x="0" y="60" width="230" height="135" rx="2" fill="#24120E"/>
    <ellipse cx="115" cy="120" rx="85" ry="40" fill="#3B1F17" fill-opacity="0.7"/>
    <!-- Crosta superior craquelada perfeita -->
    <rect x="0" y="0" width="230" height="60" rx="3" fill="url(#crinkle)"/>
    <path d="M20 22 Q75 10 135 28 T210 18" stroke="#EBC9C1" stroke-width="1.8" stroke-opacity="0.75" fill="none"/>
    <path d="M35 42 Q85 30 160 40" stroke="#EBC9C1" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
    <path d="M70 18 L85 38 L95 24" stroke="#EBC9C1" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
    
    <!-- Nozes e gotas de chocolate na superfície -->
    <ellipse cx="55" cy="22" rx="12" ry="7" fill="#B8664C" fill-opacity="0.95"/>
    <circle cx="165" cy="25" r="7" fill="#3B1F17"/>
    <polygon points="110,18 128,14 125,28 108,26" fill="#5C1A1B"/>
  </g>

  <!-- Selo editorial flutuante clássico -->
  <g transform="translate(620, 80)">
    <circle cx="45" cy="45" r="45" fill="#BFD0B0"/>
    <circle cx="45" cy="45" r="40" fill="none" stroke="#3B1F17" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="45" y="38" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#3B1F17" text-anchor="middle" letter-spacing="1">100% ARTESANAL</text>
    <text x="45" y="52" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#3B1F17" text-anchor="middle">SEM GLÚTEN</text>
    <text x="45" y="63" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#3B1F17" text-anchor="middle">SEM LACTOSE</text>
  </g>

  <!-- Legenda discreta informativa -->
  <text x="50" y="540" font-family="'Inter', sans-serif" font-size="11" fill="#3B1F17" fill-opacity="0.6" letter-spacing="0.5">
    AFETO EM PEDAÇOS · PRODUÇÃO CASEIRA DIÁRIA
  </text>
</svg>
